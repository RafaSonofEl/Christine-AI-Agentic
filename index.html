<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Christine — Better Self Storage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Mulish:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:#F7F4EE;
    --panel:#FBF9F5;
    --panel-alt:#F3EEE4;
    --line:#DED6C7;
    --text:#2C2924;
    --text-soft:#6A645B;
    --text-faint:#A79E90;
    --forest:#2F5D46;
    --forest-deep:#214332;
    --forest-light:#4A7A62;
    --accent:#C89A43;
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Mulish', system-ui, sans-serif;
  }

  body { font-family: var(--font-body); background: var(--cream); min-height: 100vh; }

  .cw-launcher {
    position: fixed; bottom: 24px; right: 24px;
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--forest); color: var(--accent);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 32px rgba(33,67,50,0.32);
    transition: transform 0.15s ease, background 0.2s ease;
    z-index: 9999;
  }
  .cw-launcher:hover { background: var(--forest-deep); transform: translateY(-2px); }
  .cw-launcher svg { width: 28px; height: 28px; }

  .cw-panel {
    position: fixed; bottom: 100px; right: 24px;
    width: 380px; max-width: calc(100vw - 32px);
    height: 600px; max-height: calc(100vh - 130px);
    background: var(--panel);
    border-radius: 22px; overflow: hidden;
    display: none; flex-direction: column;
    border: 1px solid var(--line);
    box-shadow: 0 24px 64px rgba(33,67,50,0.26);
    z-index: 9999;
  }
  .cw-panel.open { display: flex; animation: cwRise 0.28s ease; }
  @keyframes cwRise { from { opacity:0; transform: translateY(12px);} to {opacity:1; transform: translateY(0);} }

  .cw-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; background: var(--forest); color: var(--cream);
    flex-shrink: 0;
  }
  .cw-mark {
    width: 40px; height: 40px; border: 2px solid var(--accent); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 18px; color: var(--accent); flex-shrink: 0;
  }
  .cw-title { flex: 1; }
  .cw-name { font-family: var(--font-display); font-size: 20px; line-height: 1; font-weight: 500; }
  .cw-sub { margin-top: 3px; font-size: 12px; color: #CBBFA6; letter-spacing: 0.02em; }
  .cw-close { background: none; border: none; color: var(--cream); cursor: pointer; opacity: 0.8; }
  .cw-close:hover { opacity: 1; }

  .cw-messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--panel);
  }

  .cw-intro { padding: 8px 4px; }
  .cw-intro-title { font-family: var(--font-display); font-size: 22px; color: var(--forest); font-weight: 500; }
  .cw-intro-sub { font-size: 14px; color: var(--text-soft); line-height: 1.6; margin-top: 8px; }
  .cw-starters { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .cw-starter {
    padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--panel-alt); color: var(--text); font-size: 13px; line-height: 1.4;
    text-align: left; cursor: pointer; font-family: var(--font-body); transition: all 0.16s ease;
  }
  .cw-starter:hover { border-color: var(--forest-light); background: #fff; }

  .cw-msg { display: flex; gap: 10px; max-width: 90%; animation: cwRise 0.3s ease; }
  .cw-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .cw-msg.bot { align-self: flex-start; }

  .cw-av {
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display); font-size: 13px; font-weight: 500;
  }
  .cw-av.bot-av { background: var(--forest); color: var(--accent); }
  .cw-av.user-av { background: var(--panel-alt); color: var(--text-soft); font-family: var(--font-body); font-size: 10px; font-weight: 700; }

  .cw-bubble { padding: 12px 14px; border-radius: 16px; line-height: 1.5; font-size: 14px; }
  .cw-msg.bot .cw-bubble { background: var(--panel-alt); border: 1px solid var(--line); border-top-left-radius: 5px; color: var(--text); }
  .cw-msg.user .cw-bubble { background: var(--forest); color: var(--cream); border-top-right-radius: 5px; }

  .cw-typing { display: flex; gap: 4px; padding: 12px 14px; }
  .cw-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); animation: cwPulse 1.3s infinite; }
  .cw-dot:nth-child(2){animation-delay:.2s;} .cw-dot:nth-child(3){animation-delay:.4s;}
  @keyframes cwPulse { 0%,60%,100%{opacity:.3;transform:translateY(0);} 30%{opacity:1;transform:translateY(-3px);} }

  .cw-input { padding: 14px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-end; background: var(--cream); flex-shrink: 0; }
  .cw-input textarea {
    flex: 1; background: #fff; border: 2px solid var(--forest-light); border-radius: 14px;
    padding: 11px 13px; font-family: var(--font-body); font-size: 14px; line-height: 1.4;
    resize: none; min-height: 44px; max-height: 110px; outline: none; color: var(--text);
  }
  .cw-input textarea:focus { border-color: var(--forest); }
  .cw-send {
    width: 44px; height: 44px; border-radius: 12px; background: var(--forest); color: var(--accent);
    border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .cw-send:hover { background: var(--forest-deep); }
  .cw-send:disabled { background: var(--panel-alt); color: var(--text-faint); cursor: not-allowed; }
</style>
</head>

<body>

<button class="cw-launcher" id="cwLauncher" aria-label="Open chat with Christine">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
  </svg>
</button>

<div class="cw-panel" id="cwPanel" role="dialog" aria-label="Christine chat">
  <div class="cw-header">
    <div class="cw-mark">C</div>
    <div class="cw-title">
      <div class="cw-name">Christine</div>
      <div class="cw-sub">Better Self Storage</div>
    </div>
    <button class="cw-close" id="cwClose" aria-label="Close chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div class="cw-messages" id="cwMessages">
    <div class="cw-intro" id="cwIntro">
      <div class="cw-intro-title">Hi, I'm Christine</div>
      <div class="cw-intro-sub">I can help you find a unit, compare locations, or answer quick questions. What do you need?</div>
      <div class="cw-starters">
        <button class="cw-starter" data-msg="I need a storage unit, what sizes do you have?">I need a storage unit, what sizes do you have?</button>
        <button class="cw-starter" data-msg="Do you have a location near me with RV parking?">Do you have a location with RV parking?</button>
        <button class="cw-starter" data-msg="What are the access hours and how do I move in?">What are the access hours and how do I move in?</button>
      </div>
    </div>
  </div>

  <div class="cw-input">
    <textarea id="cwInput" placeholder="Message Christine..." rows="1" aria-label="Message"></textarea>
    <button class="cw-send" id="cwSend" aria-label="Send">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<script type="module">
  import { createAgent } from "./agent.js";

  const agent = createAgent();

  const panel = document.getElementById("cwPanel");
  const launcher = document.getElementById("cwLauncher");
  const messages = document.getElementById("cwMessages");
  const input = document.getElementById("cwInput");
  const sendBtn = document.getElementById("cwSend");

  launcher.addEventListener("click", () => { panel.classList.toggle("open"); input.focus(); });
  document.getElementById("cwClose").addEventListener("click", () => panel.classList.remove("open"));

  function addMessage(role, content) {
    const intro = document.getElementById("cwIntro");
    if (intro) intro.remove();
    const msg = document.createElement("div");
    msg.className = "cw-msg " + role;
    const av = document.createElement("div");
    av.className = "cw-av " + (role === "bot" ? "bot-av" : "user-av");
    av.textContent = role === "bot" ? "C" : "You";
    const bubble = document.createElement("div");
    bubble.className = "cw-bubble";
    bubble.textContent = content;
    msg.append(av, bubble);
    messages.appendChild(msg);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const intro = document.getElementById("cwIntro");
    if (intro) intro.remove();
    const t = document.createElement("div");
    t.className = "cw-msg bot"; t.id = "cwTyping";
    t.innerHTML = '<div class="cw-av bot-av">C</div><div class="cw-bubble cw-typing"><span class="cw-dot"></span><span class="cw-dot"></span><span class="cw-dot"></span></div>';
    messages.appendChild(t);
    messages.scrollTop = messages.scrollHeight;
  }
  function removeTyping() { const t = document.getElementById("cwTyping"); if (t) t.remove(); }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = ""; input.style.height = "auto";
    sendBtn.disabled = true;
    addMessage("user", text);
    showTyping();

    try {
      const { reply } = await agent.send(text);
      removeTyping();
      addMessage("bot", reply);
    } catch (e) {
      removeTyping();
      addMessage("bot", "I'm sorry, something interrupted our connection. Please try again in a moment.");
    }
    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  input.addEventListener("input", function () {
    this.style.height = "auto";
    this.style.height = Math.min(this.scrollHeight, 110) + "px";
  });
  document.querySelectorAll(".cw-starter").forEach((b) => {
    b.addEventListener("click", () => { input.value = b.dataset.msg; send(); });
  });
</script>

</body>
</html>
